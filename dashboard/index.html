<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haneef Weather Station</title>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
        }
        
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 3.5em;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.5), 0 0 40px rgba(0, 200, 255, 0.3);
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        
        .header .subtitle {
            color: #00d4ff;
            font-size: 1.2em;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .header .live-indicator {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            border-radius: 25px;
            color: #fff;
            font-size: 0.9em;
            animation: pulse 2s infinite;
        }
        
        .header .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            transform: rotate(45deg);
            transition: all 0.6s;
        }
        
        .stat-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 200, 255, 0.4);
            border-color: rgba(0, 200, 255, 0.5);
        }
        
        .stat-card:hover::before {
            top: -30%;
            left: -30%;
        }
        
        .stat-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .stat-card:nth-child(1) .stat-icon { color: #ff6b6b; }
        .stat-card:nth-child(2) .stat-icon { color: #4ecdc4; }
        .stat-card:nth-child(3) .stat-icon { color: #45b7d1; }
        .stat-card:nth-child(4) .stat-icon { color: #f9ca24; }
        
        .stat-label {
            font-size: 0.95em;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: 300;
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 3em;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }
        
        .stat-card:hover .stat-value {
            transform: scale(1.1);
        }
        
        .stat-unit {
            font-size: 0.4em;
            color: #888;
            font-weight: 400;
        }
        
        .stat-time {
            font-size: 0.85em;
            color: #666;
            margin-top: 12px;
            font-style: italic;
        }
        
        .stat-trend {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5em;
            animation: fadeIn 1s;
        }
        
        .trend-up { color: #2ecc71; }
        .trend-down { color: #e74c3c; }
        
        /* Timeline Section */
        .timeline-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease;
        }
        
        .timeline-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8em;
            color: #00d4ff;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        
        .timeline-container {
            position: relative;
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
        }
        
        .timeline-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .timeline-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .timeline-container::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.5);
            border-radius: 10px;
        }
        
        .timeline-item {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid #00d4ff;
            border-radius: 10px;
            transition: all 0.3s;
            animation: slideInLeft 0.5s ease;
        }
        
        .timeline-item:hover {
            background: rgba(0, 212, 255, 0.1);
            transform: translateX(10px);
        }
        
        .timeline-time {
            font-family: 'Orbitron', sans-serif;
            color: #00d4ff;
            font-size: 0.9em;
            min-width: 150px;
            font-weight: 700;
        }
        
        .timeline-data {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            flex: 1;
        }
        
        .timeline-data-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }
        
        .timeline-data-item i {
            font-size: 1.2em;
        }
        
        /* Chart Container */
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1.2s ease;
        }
        
        .chart-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em;
            color: #00d4ff;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        
        /* Loading Animation */
        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 100px;
            animation: fadeIn 1s;
        }
        
        .loading-spinner {
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #00d4ff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Error */
        .error {
            background: rgba(231, 76, 60, 0.2);
            border: 2px solid #e74c3c;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        /* Refresh Button */
        .refresh-btn {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        
        .refresh-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.6);
        }
        
        .refresh-btn:active {
            transform: translateY(0) scale(0.98);
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .stat-value {
                font-size: 2.2em;
            }
            
            .timeline-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .timeline-time {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background Particles -->
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <h1>HANEEF WEATHER STATION</h1>
            <div class="subtitle">Real-Time Environmental Monitoring System</div>
            <div class="live-indicator">
                <span class="live-dot"></span>
                LIVE MONITORING
            </div>
        </div>
        
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            Initializing Weather Station...
        </div>
        
        <div id="error" class="error" style="display:none;"></div>
        
        <div id="dashboard" style="display:none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-temperature-high stat-icon"></i>
                    <div class="stat-trend" id="temp-trend"></div>
                    <div class="stat-label">Temperature</div>
                    <div class="stat-value" id="temp-value">--<span class="stat-unit">°C</span></div>
                    <div class="stat-time" id="temp-time">--</div>
                </div>
                
                <div class="stat-card">
                    <i class="fas fa-tint stat-icon"></i>
                    <div class="stat-trend" id="humidity-trend"></div>
                    <div class="stat-label">Humidity</div>
                    <div class="stat-value" id="humidity-value">--<span class="stat-unit">%</span></div>
                    <div class="stat-time" id="humidity-time">--</div>
                </div>
                
                <div class="stat-card">
                    <i class="fas fa-gauge-high stat-icon"></i>
                    <div class="stat-trend" id="pressure-trend"></div>
                    <div class="stat-label">Pressure</div>
                    <div class="stat-value" id="pressure-value">--<span class="stat-unit">hPa</span></div>
                    <div class="stat-time" id="pressure-time">--</div>
                </div>
                
                <div class="stat-card">
                    <i class="fas fa-mountain stat-icon"></i>
                    <div class="stat-label">Altitude</div>
                    <div class="stat-value" id="altitude-value">--<span class="stat-unit">m</span></div>
                    <div class="stat-time" id="altitude-time">--</div>
                </div>
            </div>
            
            <!-- Timeline Section -->
            <div class="timeline-section">
                <div class="timeline-title">
                    <i class="fas fa-clock"></i> RECENT READINGS TIMELINE
                </div>
                <div class="timeline-container" id="timeline-container">
                    <!-- Timeline items will be inserted here -->
                </div>
            </div>
            
            <div class="chart-container">
                <div class="chart-title"><i class="fas fa-chart-line"></i> TEMPERATURE HISTORY</div>
                <canvas id="tempChart"></canvas>
            </div>
            
            <div class="chart-container">
                <div class="chart-title"><i class="fas fa-chart-area"></i> HUMIDITY HISTORY</div>
                <canvas id="humidityChart"></canvas>
            </div>
            
            <div class="chart-container">
                <div class="chart-title"><i class="fas fa-chart-bar"></i> PRESSURE HISTORY</div>
                <canvas id="pressureChart"></canvas>
            </div>
            
            <button class="refresh-btn" onclick="loadData()">
                <i class="fas fa-sync-alt"></i> REFRESH DATA
            </button>
        </div>
    </div>
    
    <script>
        let tempChart, humidityChart, pressureChart;
        let previousData = null;
        
        // Create animated particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 5 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        createParticles();
        
        // Auto-refresh every 3 minutes (180000ms)
        setInterval(loadData, 180000);
        
        // Load data on page load
        loadData();
        
        function loadData() {
            fetch('get_data.php?limit=50')
                .then(response => response.json())
                .then(result => {
                    if (result.status === 'success') {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('error').style.display = 'none';
                        document.getElementById('dashboard').style.display = 'block';
                        
                        updateStats(result.data);
                        updateTimeline(result.data);
                        updateCharts(result.data);
                        
                        previousData = result.data;
                    } else {
                        showError('Error: ' + result.message);
                    }
                })
                .catch(error => {
                    showError('Failed to load data: ' + error.message);
                });
        }
        
        function updateStats(data) {
            if (data.length === 0) return;
            
            const latest = data[data.length - 1];
            const previous = data.length > 1 ? data[data.length - 2] : null;
            
            // Update values with animation
            animateValue('temp-value', parseFloat(latest.temperature), '°C');
            animateValue('humidity-value', parseFloat(latest.humidity), '%');
            animateValue('pressure-value', parseFloat(latest.pressure), 'hPa');
            animateValue('altitude-value', parseFloat(latest.altitude), 'm');
            
            // Update trends
            if (previous) {
                updateTrend('temp-trend', latest.temperature, previous.temperature);
                updateTrend('humidity-trend', latest.humidity, previous.humidity);
                updateTrend('pressure-trend', latest.pressure, previous.pressure);
            }
            
            const timeStr = 'Updated: ' + formatTime(latest.timestamp);
            document.getElementById('temp-time').textContent = timeStr;
            document.getElementById('humidity-time').textContent = timeStr;
            document.getElementById('pressure-time').textContent = timeStr;
            document.getElementById('altitude-time').textContent = timeStr;
        }
        
        function animateValue(elementId, value, unit) {
            const element = document.getElementById(elementId);
            element.innerHTML = value.toFixed(1) + '<span class="stat-unit">' + unit + '</span>';
        }
        
        function updateTrend(elementId, current, previous) {
            const element = document.getElementById(elementId);
            const diff = current - previous;
            
            if (Math.abs(diff) < 0.1) {
                element.innerHTML = '<i class="fas fa-minus"></i>';
                element.className = 'stat-trend';
            } else if (diff > 0) {
                element.innerHTML = '<i class="fas fa-arrow-up"></i>';
                element.className = 'stat-trend trend-up';
            } else {
                element.innerHTML = '<i class="fas fa-arrow-down"></i>';
                element.className = 'stat-trend trend-down';
            }
        }
        
        function updateTimeline(data) {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            // Show last 10 readings
            const recentData = data.slice(-10).reverse();
            
            recentData.forEach((item, index) => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                timelineItem.style.animationDelay = (index * 0.1) + 's';
                
                timelineItem.innerHTML = `
                    <div class="timeline-time">${formatTime(item.timestamp)}</div>
                    <div class="timeline-data">
                        <div class="timeline-data-item">
                            <i class="fas fa-temperature-high" style="color: #ff6b6b;"></i>
                            <span>${parseFloat(item.temperature).toFixed(1)}°C</span>
                        </div>
                        <div class="timeline-data-item">
                            <i class="fas fa-tint" style="color: #4ecdc4;"></i>
                            <span>${parseFloat(item.humidity).toFixed(1)}%</span>
                        </div>
                        <div class="timeline-data-item">
                            <i class="fas fa-gauge-high" style="color: #45b7d1;"></i>
                            <span>${parseFloat(item.pressure).toFixed(1)} hPa</span>
                        </div>
                        <div class="timeline-data-item">
                            <i class="fas fa-mountain" style="color: #f9ca24;"></i>
                            <span>${parseFloat(item.altitude).toFixed(0)} m</span>
                        </div>
                    </div>
                `;
                
                container.appendChild(timelineItem);
            });
        }
        
        function updateCharts(data) {
            const labels = data.map(d => formatTime(d.timestamp));
            const temperatures = data.map(d => parseFloat(d.temperature));
            const humidities = data.map(d => parseFloat(d.humidity));
            const pressures = data.map(d => parseFloat(d.pressure));
            
            // Temperature Chart
            if (tempChart) tempChart.destroy();
            const tempCtx = document.getElementById('tempChart').getContext('2d');
            tempChart = new Chart(tempCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: temperatures,
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { 
                            display: true,
                            labels: { color: '#fff', font: { size: 14 } }
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: false,
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    },
                    animation: {
                        duration: 2000,
                        easing: 'easeInOutQuart'
                    }
                }
            });
            
            // Humidity Chart
            if (humidityChart) humidityChart.destroy();
            const humidityCtx = document.getElementById('humidityChart').getContext('2d');
            humidityChart = new Chart(humidityCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Humidity (%)',
                        data: humidities,
                        borderColor: '#4ecdc4',
                        backgroundColor: 'rgba(78, 205, 196, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { 
                            display: true,
                            labels: { color: '#fff', font: { size: 14 } }
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            max: 100,
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    },
                    animation: {
                        duration: 2000,
                        easing: 'easeInOutQuart'
                    }
                }
            });
            
            // Pressure Chart
            if (pressureChart) pressureChart.destroy();
            const pressureCtx = document.getElementById('pressureChart').getContext('2d');
            pressureChart = new Chart(pressureCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Pressure (hPa)',
                        data: pressures,
                        borderColor: '#45b7d1',
                        backgroundColor: 'rgba(69, 183, 209, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { 
                            display: true,
                            labels: { color: '#fff', font: { size: 14 } }
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: false,
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    },
                    animation: {
                        duration: 2000,
                        easing: 'easeInOutQuart'
                    }
                }
            });
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + message;
        }
    </script>
</body>
</html>
